<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube to MP3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <h1>YouTube to MP3</h1>
    <p>Paste YouTube URLs below to download them as MP3 files.</p>

    <label for="youtube-urls">YouTube URLs</label>
    <textarea id="youtube-urls" name="youtube-urls" rows="10" cols="60" placeholder="Paste one URL per line"></textarea>

    <div class="actions">
      <button type="button">Download</button>
    </div>
  </main>
</body>
</html>
